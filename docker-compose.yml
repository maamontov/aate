services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=3001
    expose:
      - "3001"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      - server
    ports:
      - "80:80"
    restart: unless-stopped
