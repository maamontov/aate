services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      - server
    ports:
      - "8080:80"
    restart: unless-stopped
