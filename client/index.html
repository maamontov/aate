<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AATE</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #ffffff; color: #111111; font-family: Inter, Arial, sans-serif; }
      #app { min-height: 100vh; display: grid; place-items: center; }

      .panel {
        width: min(680px, 92vw);
        padding: 20px;
        border: 1px solid #e6e6e6;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
      }
      .panel.host-panel {
        width: 96vw;
        max-width: 1200px;
        min-height: 90vh;
        display: flex;
        flex-direction: column;
      }
      .panel.phase-transition { transform: translateY(-2px); }
      .panel.phase-question { border-color: #2f80ed; box-shadow: 0 6px 20px rgba(47,128,237,0.12); }
      .panel.phase-answering { border-color: #f2c94c; box-shadow: 0 6px 20px rgba(242,201,76,0.14); }
      .panel.phase-guessing { border-color: #eb5757; box-shadow: 0 6px 20px rgba(235,87,87,0.14); }
      .panel.phase-reveal { border-color: #27ae60; box-shadow: 0 6px 20px rgba(39,174,96,0.14); }
      .panel.phase-finished { border-color: #111111; }

      input, select, button {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #d9d9d9;
        background: #ffffff;
        color: #111111;
      }
      button { cursor: pointer; transition: background 150ms ease, color 150ms ease, border-color 150ms ease; }
      button:hover { background: #111111; color: #ffffff; border-color: #111111; }

      .muted { color: #4f4f4f; font-size: 14px; transition: color 220ms ease; }
      .timer-track { width: 100%; height: 8px; border-radius: 999px; background: #efefef; overflow: hidden; margin-top: 6px; }
      .timer-bar { width: 0%; height: 100%; background: #777; transition: width 300ms linear, background 300ms linear; }
      hr { border: none; border-top: 1px solid #ececec; margin: 12px 0; }

      /* Вопрос — крупный адаптивный текст */
      .question-text {
        font-size: clamp(28px, 4vw, 48px);
        font-weight: 600;
        text-align: center;
        margin: 16px 0 24px;
        line-height: 1.35;
      }

      /* Варианты ответов — крупные карточки (для хоста) */
      .options-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 16px 0;
      }
      .option-card {
        padding: 20px 14px;
        border: 2px solid #e6e6e6;
        border-radius: 12px;
        text-align: center;
        font-size: clamp(18px, 2.5vw, 28px);
        font-weight: 500;
        line-height: 1.3;
        transition: border-color 200ms, background 200ms;
      }
      .option-card.selected-active { border-color: #f2c94c; background: #fef9e7; }
      .option-card.selected-guess { border-color: #eb5757; background: #fde8e8; }
      .option-card.match { border-color: #27ae60; background: #e8f8f0; }

      /* Код комнаты — крупный по центру */
      .room-code {
        font-size: clamp(36px, 6vw, 72px);
        font-weight: 700;
        text-align: center;
        letter-spacing: 8px;
        font-family: 'Courier New', monospace;
        margin: 24px 0;
      }

      /* Фаза + таймер — по центру */
      .phase-timer {
        text-align: center;
        font-size: 16px;
        color: #4f4f4f;
        margin: 12px 0 4px;
      }

      /* Блок игроков внизу карточки */
      .players-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0 0;
        margin-top: auto;
        border-top: 1px solid #ececec;
      }
      .player-info {
        font-size: clamp(18px, 2.5vw, 28px);
        font-weight: 600;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .player-score {
        font-size: clamp(24px, 3vw, 40px);
        font-weight: 700;
      }

      /* Варианты ответов — вертикальные (для игрока) */
      .choices-vertical {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 16px 0;
      }
      .choices-vertical button {
        padding: 20px;
        font-size: 20px;
        border-radius: 12px;
        text-align: left;
      }

      /* Статус завершения */
      .finish-status {
        text-align: center;
        font-size: clamp(18px, 2.5vw, 28px);
        font-weight: 500;
        margin: 16px 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
