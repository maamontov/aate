<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AATE</title>
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; color: #111111; font-family: Inter, Arial, sans-serif; }
      #app { min-height: 100vh; display: grid; place-items: center; }
      .panel {
        width: min(680px, 92vw);
        padding: 20px;
        border: 1px solid #e6e6e6;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
      }
      .panel.phase-transition { transform: translateY(-2px); }
      .panel.phase-question { border-color: #2f80ed; box-shadow: 0 6px 20px rgba(47,128,237,0.12); }
      .panel.phase-answering { border-color: #f2c94c; box-shadow: 0 6px 20px rgba(242,201,76,0.14); }
      .panel.phase-guessing { border-color: #eb5757; box-shadow: 0 6px 20px rgba(235,87,87,0.14); }
      .panel.phase-reveal { border-color: #27ae60; box-shadow: 0 6px 20px rgba(39,174,96,0.14); }
      .panel.phase-finished { border-color: #111111; }
      input, select, button {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #d9d9d9;
        background: #ffffff;
        color: #111111;
      }
      button { cursor: pointer; transition: background 150ms ease, color 150ms ease, border-color 150ms ease; }
      button:hover { background: #111111; color: #ffffff; border-color: #111111; }
      .row { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
      .muted { color: #4f4f4f; font-size: 14px; transition: color 220ms ease; }
      .timer-track { width: 100%; height: 8px; border-radius: 999px; background: #efefef; overflow: hidden; margin-top: 6px; }
      .timer-bar { width: 0%; height: 100%; background: #777; transition: width 300ms linear, background 300ms linear; }
      hr { border: none; border-top: 1px solid #ececec; margin: 12px 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
